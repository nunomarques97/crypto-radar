<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Crypto Radar — Agent Room (Pod Bay)</title>
<style>
  :root{
    --bg:#0B0E13; --panel:#12161D; --panel-hi:#161B23; --border:#1E242D;
    --text:#E6E9EE; --muted:#8B95A5; --muted-dim:#5A6577;
    --ok:#34D399; --warn:#F5B94D; --err:#F0616B; --info:#5B9DF6; --idle:#4B5563;
    --r-sm:6px; --r-md:10px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,Segoe UI,system-ui,sans-serif; font-size:13px; line-height:1.4;}
  .mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;}
  .app{display:grid; grid-template-columns:220px 1fr; grid-template-rows:56px 1fr; height:100vh; min-height:760px;}
  .topbar{grid-column:1/3; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--border); background:var(--panel);}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px rgba(52,211,153,.15);}
  .topbar-status{display:flex; align-items:center; gap:18px; color:var(--muted); font-size:12px;}
  .btns{display:flex; gap:8px;}
  .btn{border:1px solid var(--border); background:var(--panel-hi); color:var(--text); padding:7px 14px; border-radius:var(--r-sm); font-size:12px;}
  .btn.stop{border-color:rgba(240,97,107,.35); color:var(--err);}
  .btn.ghost{color:var(--muted);}
  .sidebar{border-right:1px solid var(--border); background:var(--panel); padding:16px 10px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{padding:9px 12px; border-radius:var(--r-sm); color:var(--muted); font-size:13px; display:flex; justify-content:space-between;}
  .nav-item.active{background:var(--panel-hi); color:var(--text); font-weight:600;}
  .nav-item .badge{font-size:11px; color:var(--muted-dim); background:var(--bg); border:1px solid var(--border); padding:1px 6px; border-radius:var(--r-pill);}
  .sidebar .sep{height:1px; background:var(--border); margin:10px 4px;}
  .main{padding:24px; overflow:auto;}
  .room-header{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 14px;}

  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px; border-radius:var(--r-pill);}
  .pill .dot{width:6px; height:6px; border-radius:50%;}
  .pill.err{color:var(--err); background:rgba(240,97,107,.10);} .pill.err .dot{background:var(--err);}
  .pill.info{color:var(--info); background:rgba(91,157,246,.10);} .pill.info .dot{background:var(--info);}
  .pill.idle{color:var(--muted); background:rgba(75,85,99,.15);} .pill.idle .dot{background:var(--idle);}

  .bay{display:flex; flex-wrap:wrap; gap:18px; max-width:1040px;}
  .pod{
    position:relative; width:220px; height:260px; border-radius:20px;
    background:linear-gradient(to bottom, #0d1119 0%, #10141c 100%);
    border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; align-items:center;
  }
  .pod .arc{position:absolute; top:-70px; left:50%; transform:translateX(-50%); width:220px; height:140px; border-radius:50%; border:1.5px solid var(--ac, var(--border)); opacity:.45;}
  .pod .spot{position:absolute; bottom:44px; width:150px; height:150px; border-radius:50%; background:radial-gradient(ellipse, var(--sp,rgba(91,157,246,.14)) 0%, transparent 70%);}
  .pod .floor-line{position:absolute; bottom:56px; left:22px; right:22px; height:1px; background:var(--border);}

  .figure{position:relative; z-index:1; margin-top:44px;}
  @keyframes corePulse{0%,100%{opacity:1;} 50%{opacity:.55;}}
  .core-working{animation:corePulse 1.8s ease-in-out infinite;}

  .holo{position:absolute; z-index:1; right:18px; bottom:70px; width:46px; height:34px; border:1px solid var(--info); border-radius:5px; background:rgba(91,157,246,.06);}
  .holo .line{position:absolute; left:5px; right:5px; height:1px; background:rgba(91,157,246,.55);}
  .holo .l1{top:8px;} .holo .l2{top:15px; right:14px;} .holo .l3{top:22px; width:60%; left:5px;}

  .plate{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); text-align:center; width:100%;}
  .plate .n{font-weight:600; font-size:12.5px;}
  .plate .r{font-size:10.5px; color:var(--muted-dim); margin-bottom:6px;}

  @keyframes zFloat{0%{opacity:0; transform:translateY(0);} 15%{opacity:.9;} 85%{opacity:.2;} 100%{opacity:0; transform:translateY(-14px);}}
  .zmarks{position:absolute; z-index:2; font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--muted-dim); top:52px; left:50%; margin-left:14px;}
  .zmarks span{position:absolute; animation:zFloat 3.2s ease-in-out infinite;}
  .zmarks span:nth-child(1){font-size:13px; animation-delay:0s;}
  .zmarks span:nth-child(2){font-size:10px; left:9px; top:6px; animation-delay:1.05s;}
  .zmarks span:nth-child(3){font-size:8px; left:16px; top:12px; animation-delay:2.1s;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> CRYPTO RADAR <span style="color:var(--muted-dim); font-weight:400;">— Control Room</span></div>
    <div class="topbar-status"><span>Uptime <b class="mono">02:14:07</b></span><span class="pill info"><span class="dot"></span>RUNNING</span></div>
    <div class="btns"><button class="btn ghost">RESTART</button><button class="btn stop">STOP RADAR</button></div>
  </div>
  <div class="sidebar">
    <div class="nav-item">Dashboard</div>
    <div class="nav-item active">Agentes</div>
    <div class="nav-item">Alertas <span class="badge">3</span></div>
    <div class="nav-item">Histórico</div>
    <div class="sep"></div>
    <div class="nav-item">Sistema / Logs</div>
  </div>

  <div class="main">
    <h3 class="room-header">Agent Control Room — Pod Bay</h3>

    <div class="bay">

      <!-- QWEN — WORKING -->
      <div class="pod">
        <div class="arc" style="--ac:var(--info);"></div>
        <div class="spot" style="--sp:rgba(91,157,246,.16);"></div>
        <div class="floor-line"></div>
        <svg class="figure" width="56" height="96" viewBox="0 0 56 96">
          <line x1="28" y1="8" x2="28" y2="2" stroke="var(--info)" stroke-width="1.4"/>
          <circle class="core-working" cx="28" cy="2" r="2.4" fill="var(--info)"/>
          <rect x="14" y="8" width="28" height="20" rx="8" fill="var(--panel-hi)" stroke="var(--info)" stroke-width="1.2"/>
          <circle cx="22" cy="17" r="1.8" fill="var(--text)"/><circle cx="34" cy="17" r="1.8" fill="var(--text)"/>
          <rect x="10" y="30" width="36" height="30" rx="10" fill="var(--panel-hi)" stroke="var(--border)"/>
          <circle class="core-working" cx="28" cy="44" r="4.5" fill="var(--info)"/>
          <rect x="6" y="34" width="7" height="16" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)" transform="rotate(35 9.5 34)"/>
          <rect x="43" y="34" width="7" height="16" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)" transform="rotate(-35 46.5 34)"/>
          <rect x="17" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
          <rect x="31" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
        </svg>
        <div class="holo"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div></div>
        <div class="plate"><div class="n">QWEN 14B</div><div class="r">Screener</div>
          <span class="pill info"><span class="dot"></span>WORKING</span>
        </div>
      </div>

      <!-- RED TEAM — NOT CONFIGURED -->
      <div class="pod" style="opacity:.7;">
        <div class="arc" style="--ac:var(--border); opacity:.25;"></div>
        <div class="spot" style="--sp:rgba(75,85,99,.08);"></div>
        <div class="floor-line"></div>
        <svg class="figure" width="56" height="96" viewBox="0 0 56 96">
          <line x1="28" y1="8" x2="28" y2="2" stroke="var(--muted-dim)" stroke-width="1.2" stroke-dasharray="2 2"/>
          <circle cx="28" cy="2" r="2.4" fill="none" stroke="var(--muted-dim)"/>
          <rect x="14" y="9" width="28" height="20" rx="8" fill="var(--panel-hi)" stroke="var(--muted-dim)" stroke-width="1.2" stroke-dasharray="4 3"/>
          <line x1="20" y1="17" x2="24" y2="17" stroke="var(--muted-dim)" stroke-width="1.4"/><line x1="32" y1="17" x2="36" y2="17" stroke="var(--muted-dim)" stroke-width="1.4"/>
          <rect x="10" y="30" width="36" height="30" rx="10" fill="var(--panel-hi)" stroke="var(--border)" stroke-dasharray="4 3"/>
          <circle cx="28" cy="44" r="4.5" fill="none" stroke="var(--muted-dim)" stroke-width="1.2"/>
          <rect x="5" y="36" width="7" height="24" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)"/>
          <rect x="44" y="36" width="7" height="24" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)"/>
          <rect x="17" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
          <rect x="31" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
        </svg>
        <div class="plate"><div class="n">RED TEAM</div><div class="r">Adversarial review</div>
          <span class="pill idle"><span class="dot"></span>NOT CONFIGURED</span>
        </div>
      </div>

      <!-- SONNET — SLEEPING, curled up inside its own pod -->
      <div class="pod">
        <div class="arc" style="--ac:var(--idle); opacity:.3;"></div>
        <div class="spot" style="--sp:rgba(75,85,99,.10);"></div>
        <div class="floor-line"></div>
        <div class="zmarks"><span>Z</span><span>z</span><span>z</span></div>
        <svg class="figure" width="72" height="70" viewBox="0 0 72 70" style="margin-top:78px;">
          <!-- curled sitting: knees-to-chest blob with head resting on top -->
          <rect x="18" y="26" width="40" height="34" rx="17" fill="var(--panel-hi)" stroke="var(--border)" stroke-width="1.2"/>
          <circle cx="38" cy="46" r="4" fill="var(--idle)" opacity=".7"/>
          <rect x="22" y="8" width="24" height="20" rx="8" fill="var(--panel-hi)" stroke="var(--border)" stroke-width="1.2" transform="rotate(-10 34 18)"/>
          <line x1="27" y1="18" x2="31" y2="19" stroke="var(--muted-dim)" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="35" y1="19" x2="39" y2="18" stroke="var(--muted-dim)" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <div class="plate"><div class="n">SONNET</div><div class="r">Orchestrator</div>
          <span class="pill idle"><span class="dot"></span>SLEEPING</span>
        </div>
      </div>

      <!-- FABLE — ERROR -->
      <div class="pod">
        <div class="arc" style="--ac:var(--err);"></div>
        <div class="spot" style="--sp:rgba(240,97,107,.14);"></div>
        <div class="floor-line"></div>
        <svg class="figure" width="56" height="96" viewBox="0 0 56 96">
          <line x1="28" y1="8" x2="28" y2="2" stroke="var(--err)" stroke-width="1.4"/>
          <circle cx="28" cy="2" r="2.4" fill="var(--err)"/>
          <g transform="rotate(6 28 18)">
            <rect x="14" y="8" width="28" height="20" rx="8" fill="var(--panel-hi)" stroke="var(--err)" stroke-width="1.2"/>
            <line x1="20" y1="15" x2="25" y2="18" stroke="var(--err)" stroke-width="1.5"/><line x1="36" y1="15" x2="31" y2="18" stroke="var(--err)" stroke-width="1.5"/>
          </g>
          <rect x="10" y="30" width="36" height="30" rx="10" fill="var(--panel-hi)" stroke="var(--border)"/>
          <circle cx="28" cy="44" r="4.5" fill="var(--err)"/>
          <rect x="6" y="36" width="7" height="24" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)" transform="rotate(8 9.5 36)"/>
          <rect x="43" y="36" width="7" height="24" rx="3.5" fill="var(--panel-hi)" stroke="var(--border)" transform="rotate(-8 46.5 36)"/>
          <rect x="17" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
          <rect x="31" y="64" width="8" height="22" rx="3" fill="var(--panel-hi)" stroke="var(--border)"/>
        </svg>
        <div class="plate"><div class="n">FABLE 5.1</div><div class="r">Trading analyst</div>
          <span class="pill err"><span class="dot"></span>ERROR</span>
        </div>
      </div>

      <!-- future agent placeholder pod -->
      <div class="pod" style="border-style:dashed; align-items:center; justify-content:center; opacity:.4;">
        <span class="mono" style="color:var(--muted-dim); font-size:11px;">+ future agent</span>
      </div>

    </div>
  </div>
</div>
</body>
</html>
